; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
extra_scripts = post:scripts/update_readme_memory.py
board_build.partitions = partitions_esp32.csv
lib_deps =
	knolleary/PubSubClient @ ^2.8
	aircoookie/Espalexa @ ^2.7.0

; Set any feature to 0 to compile without it.
build_flags =
	-D ENABLE_ESP_NOW=1
	-D ENABLE_ALEXA=1
	-D ENABLE_WEB_UI=1
	-D ENABLE_MQTT=1
	-D ENABLE_MDNS=1
	-D ENABLE_OTA=1

build_type = debug

debug_tool = esp-prog
debug_init_break = tbreak setup

; Lower adapter speed for stability
debug_speed = 100

; Use the correct board config (avoid deprecated wrover.cfg)
;debug_extra_cmds =
;  -f board/esp32.cfg

[env:esp8266]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
extra_scripts = pre:scripts/patch_pubsubclient.py, post:scripts/update_readme_memory.py
lib_deps =
	knolleary/PubSubClient @ ^2.8
	aircoookie/Espalexa @ ^2.7.0

; Set any feature to 0 to compile without it.
build_flags =
	-D ENABLE_ESP_NOW=1
	-D ENABLE_ALEXA=1
	-D ENABLE_WEB_UI=1
	-D ENABLE_MQTT=1
	-D ENABLE_MDNS=1
	-D ENABLE_OTA=1
